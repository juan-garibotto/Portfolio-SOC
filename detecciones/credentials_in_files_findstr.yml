title: Credential Search in Local Files via findstr or Select-String
id: b2a6c4e1-9f33-4d7b-8c10-5e7a1f0d9c23
status: experimental
description: Detects credential sweeps across local files using findstr.exe or Select-String with password patterns, mapping T1552.001 to a specific rule instead of the generic PowerShell execution alert
references:
    - https://attack.mitre.org/techniques/T1552/001/
logsource:
    product: windows
    category: process_creation
detection:
    selection_findstr:
        Image|endswith: '\findstr.exe'
        CommandLine|contains:
            - 'pass'
            - 'password'
            - 'pwd'
    selection_powershell:
        CommandLine|contains|all:
            - 'Select-String'
            - 'password'
    condition: selection_findstr or selection_powershell
falsepositives:
    - Administrators searching config files for credentials
    - Legitimate audit scripts
level: medium
tags:
    - attack.credential_access
    - attack.t1552.001
